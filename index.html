<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>免疫風濕科 口試模擬｜台灣內科專科醫師口試</title>
<meta name="description" content="台灣內科專科醫師口試前的免疫風濕科口試模擬：11 個病例、44 題，以鑑別診斷為主軸，逐題出現、60 秒倒數，附參考答案與 PubMed 文獻。">
<style>
:root{
  --paper:#F3F5F7; --sheet:#FFFFFF; --ink:#17212B; --ink2:#4A5866; --ink3:#7A8794;
  --rule:#D5DCE3; --rule2:#E9EEF2;
  --teal:#0B6E7A; --teal2:#095A64; --tealsoft:#E3F1F3;
  --mark:#FFE86B; --red:#B8232F; --redsoft:#FBE9EA; --green:#2F7D4F; --greensoft:#E6F3EA;
  --maxw:760px; --r:6px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.7}
a{color:var(--teal2)}
a:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
h1,h2,h3,h4{line-height:1.3;margin:0}
h1{font-size:clamp(22px,5.2vw,30px);font-weight:700;letter-spacing:.01em}
h2{font-size:clamp(19px,4.4vw,24px);font-weight:700;margin:28px 0 12px}
h3{font-size:17px;font-weight:700;margin:20px 0 8px}
h4{font-size:15px;font-weight:700;color:var(--ink2);margin:14px 0 4px}
p{margin:0 0 10px}
ul,ol{margin:0 0 10px;padding-left:1.3em}
li{margin:4px 0}
li::marker{color:var(--ink3)}
mark{background:linear-gradient(transparent 32%,var(--mark) 32%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 .12em;border-radius:2px}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:8px 14px;cursor:pointer;line-height:1.3;min-height:40px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal2)}
.btn.good{background:var(--greensoft);border-color:var(--green);color:var(--green)}
.btn.warn{background:var(--redsoft);border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:14px;color:var(--ink2)}
.muted{color:var(--ink3)}
.tag{display:inline-block;font-size:12.5px;line-height:1;padding:5px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.tag.hi{border-color:var(--teal);color:var(--teal)}
.tag.emerg{border-color:var(--red);color:var(--red)}
.pmid{font-size:13.5px;color:var(--teal2);text-decoration:none;border-bottom:1px solid var(--rule);margin-right:8px;white-space:nowrap}
.pmid:hover{border-bottom-color:var(--teal)}
.refs{font-size:13.5px;color:var(--ink2);margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule)}

/* header */
.top{background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10}
.top .wrap{padding-top:14px}
.sub{font-size:14px;color:var(--ink2);margin:6px 0 4px}
.prog{font-size:13px;color:var(--ink3);margin:0 0 8px;min-height:1.4em}
.tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 12px;max-width:var(--maxw);margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--ink2);cursor:pointer;font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--teal2);border-bottom-color:var(--teal);font-weight:700}
main{padding:16px 0 64px}
section[role="tabpanel"][hidden]{display:none}

/* ten-minute sheet: the one loud element */
.ten-wrap{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px 16px 8px;margin:8px 0 22px;position:relative}
.ten-wrap h2{margin:0 0 4px}
.ten-wrap .small{margin-bottom:10px}
ol.ten{padding-left:1.6em;margin:0}
ol.ten li{margin:8px 0;padding-left:.2em}
ol.ten li::marker{color:var(--teal);font-weight:700}

/* search + topic cards */
.search{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--sheet);margin:6px 0 10px}
.topic{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:var(--r);margin:10px 0;padding:0 14px}
.topic[data-freq="高"]{border-left-color:var(--teal)}
.topic[data-freq="中"]{border-left-color:#8FB8BE}
.topic summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 0;font-weight:700;font-size:16.5px}
.topic summary::-webkit-details-marker{display:none}
.topic summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(-45deg);flex:0 0 auto;transition:transform .15s}
.topic[open] summary::before{transform:rotate(45deg)}
.topic summary .name{flex:1}
.topic .body{padding:0 0 14px}
.topic .one{font-size:15.5px;color:var(--ink2);margin:0 0 6px;padding:8px 10px;background:var(--paper);border-radius:4px}
.topic ul{padding-left:1.2em}
.topic li{font-size:15px}
.topic li.urgent{border-left:3px solid var(--red);padding-left:8px;list-style:none;margin-left:-1.2em}
.topic li.tw{border-left:3px solid var(--mark);padding-left:8px;list-style:none;margin-left:-1.2em}
.legend{font-size:13px;color:var(--ink3);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 8px}

/* tables */
.tbl{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);margin:8px 0 18px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--rule2)}
th{background:var(--paper);font-weight:700;color:var(--ink2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;white-space:nowrap}
.tbl.wrapcol td:first-child{white-space:normal;min-width:7em}
.emerg td:first-child{border-left:3px solid var(--red)}

/* flashcards */
.fc-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.fc-bar select{font:inherit;padding:8px 10px;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--sheet);max-width:100%}
.fc{perspective:1200px;margin:6px 0 12px}
.fc-inner{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.is-flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px 18px 40px;display:flex;flex-direction:column}
.fc-face .lbl{font-size:13px;color:var(--ink3);margin-bottom:8px}
.fc-face .txt{font-size:17px;line-height:1.65;flex:1}
.fc-face .hint{position:absolute;bottom:12px;right:16px;font-size:12.5px;color:var(--ink3)}
.fc-a{transform:rotateY(180deg);border-left:4px solid var(--teal)}
.fc-a .txt{font-size:16px}
.fc-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.fc-actions .grp{display:flex;gap:8px}
.fc-status{margin:10px 0 0;font-size:14px;color:var(--ink2)}
.bar{height:6px;background:var(--rule2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}

/* cases */
.case-list{display:grid;gap:8px;margin:8px 0 16px}
.case-item{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.case-item:hover{border-color:var(--teal)}
.case-item .n{color:var(--teal);font-weight:700;flex:0 0 auto}
.case-item .t{font-weight:700}
.case-item .d{font-size:13.5px;color:var(--ink2);display:block;margin-top:2px}
.case-item.done .n::after{content:" ✓"}
.case{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.case .vig{background:var(--paper);border-radius:4px;padding:10px 12px;margin:8px 0 14px;font-size:15.5px}
.step{border-top:1px solid var(--rule2);padding:12px 0}
.step .q{font-weight:700;margin:0 0 8px}
.step .q::before{content:"主考官：";color:var(--teal);font-weight:700}
.step .ans{margin-top:8px;border-left:3px solid var(--teal);padding-left:10px}
.step .ans ul{margin:0;padding-left:1.1em}
.step .ans li{font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink2);margin-left:8px}
.timer.low{color:var(--red);font-weight:700}
.case-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:12px;align-items:center}

/* quiz */
.quiz{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.quiz .qn{font-size:13px;color:var(--ink3);margin-bottom:6px}
.quiz .qt{font-weight:700;font-size:16.5px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:var(--r);padding:10px 12px;cursor:pointer;line-height:1.5}
.opt:hover{border-color:var(--teal)}
.opt.correct{border-color:var(--green);background:var(--greensoft)}
.opt.wrong{border-color:var(--red);background:var(--redsoft)}
.opt:disabled{cursor:default;opacity:1}
.exp{margin-top:12px;border-left:3px solid var(--teal);padding-left:10px;font-size:15px}
.quiz-nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.score{font-size:18px;font-weight:700;margin:6px 0}

footer{border-top:1px solid var(--rule);padding:18px 0 40px;font-size:13px;color:var(--ink3)}
footer .wrap p{margin:0 0 6px}

@media (min-width:640px){
  body{font-size:17px}
  .topic li{font-size:15.5px}
  .fc-face .txt{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .fc-inner{transition:none}
  .bar i{transition:none}
  .topic summary::before{transition:none}
}
@media print{
  .top{position:static}
  .tabs,.search,.btn,.fc-bar{display:none}
  section[role="tabpanel"][hidden]{display:block}
  .topic{break-inside:avoid}
  .topic .body{display:block}
  details>summary::before{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>免疫風濕科 口試模擬</h1>
    <p class="sub">11 個病例、44 題，以<b>鑑別診斷</b>為主軸：先列鑑別並說明排序理由，再談要問什麼、查什麼、怎麼解讀，最後才是內科層級的治療原則與轉介時機。先<b>大聲說出</b>回答再展開參考答案；每題附 60 秒倒數。</p>
    <p class="prog" id="prog"></p>
  </div>
</header>

<main class="wrap">
  <section aria-label="口試模擬">
    <div class="fc-bar">
      <label class="small"><input type="checkbox" id="case-timer-on" checked> 開啟 60 秒倒數</label>
      <button class="btn" id="case-random" type="button">隨機抽一個病例</button>
      <button class="btn" id="case-reset" type="button">重設進度</button>
    </div>
    <div id="case-list" class="case-list"></div>
    <div id="case-view"></div>
  </section>

  <details class="topic" id="refs-wrap">
    <summary><span class="name">本頁文獻</span><span class="tag" id="ref-count"></span></summary>
    <div class="body" id="ref-list"></div>
  </details>
</main>

<footer>
  <div class="wrap">
    <p>教學複習用途，非臨床決策依據；劑量與流程請以最新指引與院內規範為準。內容整理自 PubMed 收錄之分類標準、治療指引與關鍵研究。</p>
    <p>可直接發佈：本檔為單一 HTML，無外部相依。完成進度只保存在目前瀏覽期間。</p>
  </div>
</footer>

/* 設計原則：每題先鑑別診斷（排序＋理由）→ 再問要問／看／查什麼與如何解讀 → 紅旗與急症 → 治療只講內科層級的原則與轉介時機 */
const CASES = [
{id:"c1",title:"55 歲女性，8 週對稱性小關節腫痛",desc:"多關節炎的鑑別框架 → 檢查判讀 → RA 的分類與治療原則",
vig:"55 歲女性，8 週來雙手 MCP、PIP、雙腕與雙足 MTP 對稱性腫痛，晨僵約 2 小時，倦怠；無皮疹、無腹瀉或泌尿道症狀、無乾癬；發病前 1 個月曾有上呼吸道感染。理學檢查：雙手 MCP、PIP 腫脹壓痛，雙腕滑膜增厚，指甲正常，無皮下結節。",
steps:[
{q:"你的鑑別診斷是什麼？怎麼排序、理由為何？",a:[
"先定位：<b>慢性（>6 週）、發炎性（晨僵 >1 小時、有腫脹）、對稱性小關節多關節炎</b>——這個組合首先想類風濕性關節炎。",
"主要鑑別：病毒性關節炎（parvovirus B19、HBV/HCV、rubella、登革熱／屈公病；多在 6 週內自限，前驅感染是線索）；SLE（年輕女性、皮疹、口腔潰瘍、血球低、蛋白尿）；乾癬性關節炎（乾癬、指甲病變、DIP、指趾炎、不對稱）；反應性關節炎（腸道／泌尿道感染後、下肢大關節）；多關節痛風或 CPPD（老年、發作史、tophi、軟骨鈣化）；PMR／RS3PE（>50 歲、肩髖帶、凹陷性水腫）。",
"較少見但要提：副腫瘤、甲狀腺功能低下、類肉瘤病、血色沉著症、肥厚性骨關節病；非發炎性的骨關節炎（DIP/PIP 骨性腫大、晨僵短）。",
"排序理由：對稱小關節、晨僵 2 小時、已持續 8 週、沒有皮膚／腸道／泌尿道線索 → RA 最可能，其次病毒性關節炎與 SLE。"],refs:[20872595]},
{q:"還要問什麼、看什麼？檢查怎麼開，怎麼解讀？",a:[
"病史：乾癬與家族史、口乾眼乾、雷諾、光敏感、口腔潰瘍、腹瀉或尿道炎、發燒、旅遊蚊蟲、藥物（isoniazid、hydralazine 等）、B/C 型肝炎。",
"理學：畫關節分布圖（DIP 是否侵犯）、指甲、頭皮／肚臍／臀溝找乾癬、皮下結節、附著點、乾燥症。",
"檢查：CBC、ESR/CRP、肝腎功能、尿液、RF＋anti-CCP、ANA（篩檢）、HBsAg/anti-HBc/anti-HCV、TSH、尿酸；雙手雙足 X 光（侵蝕、關節旁骨質疏鬆），關節超音波（滑膜炎、power Doppler）。",
"解讀：anti-CCP 特異度約 95%、RF 約 85%（RF 也見於 HCV、Sjögren、心內膜炎、老年人）；兩者都陰性不排除 RA（血清陰性約 20–30%）；ANA 1:80 低效價見於 5–15% 健康人，要配合臨床。"],refs:[17548411]},
{q:"RF 與 anti-CCP 高效價、CRP 3.2 mg/dL、X 光尚無侵蝕。診斷？如何向考官說明分類標準？",a:[
"類風濕性關節炎。2010 ACR/EULAR：前提 ≥1 關節確定滑膜炎且無更好解釋；四大項計分——關節數目部位（0–5）、血清學（0–3）、急性期反應物（0–1）、病程 ≥6 週（0–1），≥6/10 即分類。",
"本例：>10 個小關節 5 分＋高效價血清學 3 分＋CRP 1 分＋≥6 週 1 分 = 10 分。",
"補一句：分類標準為研究設計，臨床診斷靠整體判斷；血清陽性、高活性、早期侵蝕是不良預後因子，應早期轉介風濕科。"],refs:[20872595]},
{q:"治療原則（內科層級即可）？",a:[
"早期、目標導向（treat-to-target）：確診即開始 csDMARD，首選 methotrexate 每週一次併葉酸；短期低劑量類固醇橋接，NSAID 控制症狀；3–6 個月未達標由風濕科升階至生物製劑或 JAK 抑制劑。",
"開免疫抑制前的內科功課：HBV（HBsAg 陽性需預防性抗病毒）、結核（IGRA 與 CXR）、肝腎功能、疫苗、懷孕計畫。",
"共病管理：心血管風險、骨質疏鬆、戒菸。"],refs:[34101376,36357155]}
]},

{id:"c2",title:"26 歲女性，發燒、關節痛、臉部紅疹與蛋白尿",desc:"多系統侵犯的鑑別 → ANA 判讀與腎切片指徵 → SLE 的急症與治療原則",
vig:"26 歲女性，1 個月來低燒、倦怠、雙手小關節痛、臉頰紅疹（曬太陽後加重）、口腔無痛潰瘍，近 1 週腳踝水腫。BP 142/90。尿液：蛋白 3+、RBC 20–30/HPF、紅血球圓柱。Hb 9.8、WBC 3,200、PLT 96,000、Cr 0.9。",
steps:[
{q:"鑑別診斷？",a:[
"框架：<b>年輕女性＋多系統（發燒、關節、皮膚、黏膜、腎、三系血球低）</b> → 全身性紅斑狼瘡第一。",
"必須鑑別的感染：急性 HIV、parvovirus B19、EBV/CMV、HBV/HCV、感染性心內膜炎、結核——發燒與血球低在 SLE 也可能是感染，兩者可並存。",
"其他結締組織病與血管炎：MCTD、皮肌炎、Sjögren、IgA 血管炎；藥物性狼瘡（hydralazine、procainamide、isoniazid、minocycline、TNF 抑制劑）。",
"血液與腎臟：TTP（血小板低＋溶血＋腎——看抹片破碎紅血球）、淋巴瘤、感染後腎絲球腎炎。",
"臉部紅疹鑑別：酒糟、脂漏性皮膚炎、皮肌炎 heliotrope；SLE 蝶形疹避開鼻唇溝。"],refs:[31383717]},
{q:"檢查怎麼開？ANA 陽性怎麼解讀？什麼時候要腎切片？",a:[
"抗體：ANA（篩檢，敏感度 >95%，陰性幾乎排除；但特異度低）；anti-dsDNA（特異，效價隨活性）、anti-Sm（最特異）、anti-Ro/La、anti-RNP（高效價單獨 → MCTD）、抗磷脂抗體三項。",
"活性與器官：C3/C4、CBC＋抹片、Coombs、網狀紅血球、尿沉渣、UPCR 或 24 小時尿蛋白、Cr、肝功能、CK；CXR、心電圖／心臟超音波（漿膜炎）。",
"感染排除：血液培養、HIV、HBV/HCV、CRP 與 procalcitonin（SLE 發作 CRP 通常不高，明顯升高偏感染）。",
"腎切片指徵：蛋白尿 ≥0.5 g/天（UPCR ≥0.5），尤其合併活動性沉渣或 Cr 上升；切片分級（ISN/RPS）決定治療。"],refs:[31383717,40331662]},
{q:"ANA 1:640、anti-dsDNA 高效價、C3/C4 低、抹片無破碎紅血球、培養陰性。診斷？有哪些急症要注意？",a:[
"SLE 合併狼瘡腎炎。2019 EULAR/ACR：ANA ≥1:80 入門，臨床與免疫項加權 ≥10 分且 ≥1 臨床項（本例遠超）；每項須先排除感染與藥物。",
"紅旗：快速惡化腎功能（RPGN）、神經精神狼瘡（癲癇、精神症狀、意識改變）、肺泡出血、心包填塞、嚴重溶血或血小板低、巨噬細胞活化症候群（ferritin 飆升＋血球下降）、抗磷脂抗體陽性的血栓、合併感染。"],refs:[31383717]},
{q:"治療原則與衛教（內科層級）？",a:[
"所有 SLE 皆用 hydroxychloroquine（≤5 mg/kg/d，定期眼底追蹤）；發作用類固醇，目標盡快減到 ≤5 mg/d。",
"狼瘡腎炎 class III/IV：轉風濕／腎臟科誘導（類固醇＋ mycophenolate 或 cyclophosphamide，可加 belimumab 或 calcineurin 抑制劑）；同時 ACEi/ARB、血壓控制、避免 NSAID。",
"衛教：防曬、疫苗、避孕（MMF/CYC 致畸；aPL 陽性禁含雌激素避孕）；懷孕需病情穩定 ≥6 個月並先查 anti-Ro 與 aPL；感染與心血管風險。"],refs:[37827694,40331662,32090480]}
]},

{id:"c3",title:"45 歲男性，急性紅腫熱痛的膝關節與發燒",desc:"急性單關節炎：感染性 vs 結晶性 → 關節液判讀 → 痛風的降尿酸與台灣 HLA-B*5801",
vig:"45 歲男性，有高血壓與痛風病史（去年兩次腳趾發作），昨晚起右膝劇痛腫脹、無法承重，體溫 38.6°C。WBC 14,500、CRP 12 mg/dL、尿酸 9.2 mg/dL、Cr 1.4。",
steps:[
{q:"鑑別診斷？哪一個最不能漏？",a:[
"框架：<b>急性單關節炎＋發燒＝感染性關節炎，直到證明不是</b>；痛風病史不能排除感染，兩者可共存。",
"感染性：非淋菌性（S. aureus 最常見；危險因子：糖尿病、RA、人工關節、皮膚感染、靜脈藥癮）、淋菌性（年輕性活躍、遊走性關節痛＋腱鞘炎＋膿疱）、結核／黴菌（慢性）。",
"結晶性：痛風（第一蹠趾、既往發作、利尿劑、CKD、酒精）、CPPD（老年、膝腕、軟骨鈣化、常合併副甲狀腺亢進或血鐵沉積）。",
"其他：外傷／血關節（抗凝、血友病）、反應性關節炎、周邊型脊椎關節炎、OA 急性惡化；要區分關節內與關節周圍（滑囊炎、蜂窩性組織炎）。"],refs:[17405973]},
{q:"第一步做什麼？關節液怎麼判讀？",a:[
"立即關節穿刺（未抽液前不打關節內類固醇）並同時血液培養 ×2；送細胞數與分類、Gram 染色、細菌（與淋菌）培養、偏光顯微鏡看結晶。",
"WBC 判讀：<200 正常；200–2,000 非發炎性（OA、外傷）；2,000–50,000 發炎性（痛風、RA、SpA）；>50,000 且 PMN >90% 強烈提示感染（>50,000 LR 7.7、>100,000 LR 28），但痛風也可 >50,000。",
"Gram 染色敏感度僅約 50%、培養約 80%，陰性不能排除；結晶：MSU 針狀、負雙折光；CPP 菱形、弱正雙折光。",
"急性發作時血尿酸可正常，不能用來排除痛風。"],refs:[17405973,26352873]},
{q:"關節液 WBC 68,000、PMN 92%、見 MSU 結晶、Gram 陰性。怎麼處置？",a:[
"視為「痛風＋可能合併感染」：經驗性抗生素覆蓋 S. aureus（MRSA 風險用 vancomycin，懷疑淋菌加 ceftriaxone），每日反覆抽吸或關節鏡引流；48–72 小時培養陰性且臨床改善再停抗生素。",
"痛風急性期：NSAID、低劑量 colchicine（1.0 mg 後 1 小時 0.5 mg）或關節內／全身類固醇——感染未排除前避免全身類固醇；依腎功能（Cr 1.4）選藥調量。",
"檢視危險因子：利尿劑、CKD、酒精、代謝症候群。"],refs:[20131255,32390306]},
{q:"何時開始降尿酸？在台灣開 allopurinol 前要注意什麼？",a:[
"指徵：一年 ≥2 次發作、tophus、影像侵蝕；合併 CKD ≥3、尿酸 >9 或尿路結石也支持；無症狀高尿酸不治療。",
"目標尿酸 <6 mg/dL（有 tophi <5）；allopurinol 低劑量起、緩慢上調，同時 colchicine 預防 3–6 個月；急性期也可開始。",
"台灣重點：先查 HLA-B*5801（帶因率約 20%；allopurinol 嚴重皮膚反應者幾乎全帶因；前瞻篩檢可將 SCAR 降到 0）；陽性改 febuxostat（有心血管病史者需討論 CARES 疑慮）或 benzbromarone。"],refs:[32390306,15743917,26399967,29527974]}
]},

{id:"c4",title:"72 歲男性，新發頭痛、下顎痠痛與短暫視力喪失",desc:"老年新發頭痛與 ESR 升高的鑑別 → 先治療再確診 → PMR 與長期類固醇照護",
vig:"72 歲男性，3 週新發右側顳部頭痛、咀嚼時下顎痠痛、早晨肩頸僵硬起床困難，昨天右眼短暫黑矇 5 分鐘。體溫 37.6°C，右顳動脈壓痛、搏動減弱。ESR 88 mm/h、CRP 6.2 mg/dL、Hb 10.8、PLT 480,000。",
steps:[
{q:"鑑別診斷？哪些線索最有鑑別力？",a:[
"首要：<b>巨細胞動脈炎</b>——≥50 歲新發頭痛、下顎跛行、顳動脈壓痛與搏動減弱、一過性黑矇、ESR/CRP 升高、貧血與血小板增多；下顎跛行與顳動脈異常的陽性概似比最高。",
"合併肩頸晨僵 → 風濕性多發性肌痛（PMR）；約半數 GCA 有 PMR 症狀。",
"頭痛的其他鑑別：緊張型、頸源性、顱內病灶或蛛網膜下腔出血（紅旗：雷擊樣、神經學異常）、三叉神經痛、顳顎關節、帶狀疱疹前驅。",
"一過性黑矇的鑑別：頸動脈狹窄栓塞、非動脈炎性前部缺血性視神經病變、視網膜動脈阻塞。",
"ESR 升高的其他原因：感染性心內膜炎、多發性骨髓瘤、惡性腫瘤、其他血管炎（Takayasu 見於年輕人）；肩頸僵硬的其他原因：老年發病 RA、肌炎、甲狀腺功能低下、頸椎病。"],refs:[36351706]},
{q:"先做檢查還是先治療？要做哪些檢查、怎麼解讀？",a:[
"先治療：有視力症狀即為急症，立即高劑量類固醇（IV methylprednisolone 500–1,000 mg/d ×3 天，接 prednisone 1 mg/kg），當日眼科會診；不等切片。",
"確診：顳動脈超音波（halo sign）或切片（開始類固醇後 2 週內仍可陽性；取 ≥1 cm，注意 skip lesion）；懷疑大血管型（雙上肢血壓差、雜音、不明發燒、體重減輕）→ CTA/MRA 或 PET。",
"基本檢查：CBC、ESR/CRP、肝功能（ALP 可升）、蛋白電泳排除骨髓瘤、發燒者血液培養、眼底檢查。",
"解讀：ESR 正常不能完全排除（<5%）；切片陰性但臨床典型仍可治療；2022 分類標準 ≥50 歲必備、總分 ≥6。"],refs:[36351706,31270110]},
{q:"若病人只有肩髖帶晨僵、沒有頭痛與視力症狀，你怎麼想？",a:[
"PMR：≥50 歲、雙肩痛 ≥2 週、晨僵 >45 分、ESR/CRP 升高、RF/anti-CCP 陰性；2012 EULAR/ACR 暫行標準（≥4 分，超音波 ≥5）。",
"鑑別：老年發病 RA、GCA、肌炎（CK 高、無力）、甲狀腺功能低下、感染性心內膜炎、多發性骨髓瘤、副腫瘤、肩關節疾病。",
"起始 prednisone 12.5–25 mg/d，1 週內明顯改善是重要佐證；反應不佳要重新思考診斷。",
"每次回診都要問 GCA 症狀（頭痛、下顎跛行、視力），PMR 可轉為 GCA。"],refs:[22388996,26352874]},
{q:"長期類固醇的內科照護？",a:[
"骨質保護（Ca/Vit D，中高風險口服 bisphosphonate）、血糖與血壓、眼壓與白內障、感染（高劑量併免疫抑制時 PJP 預防）、疫苗。",
"減量緩慢（1–2 年）；復發時回到前一有效劑量；反覆復發或副作用高風險 → 風濕科考慮 tocilizumab 或 MTX 省類固醇；每年評估主動脈瘤。"],refs:[37845798,31270110]}
]},

{id:"c5",title:"62 歲男性，喀血、血尿與快速惡化的腎功能",desc:"肺腎症候群的鑑別（含非免疫性假象）→ 抗體與切片判讀 → 急迫性與治療原則",
vig:"62 歲男性，1 個月來倦怠、體重減輕、鼻塞帶血痂，2 天前開始喀血。BP 150/95、SpO2 91%。Cr 3.8（3 個月前 1.0），尿蛋白 2+、紅血球圓柱；Hb 8.5（較前下降 3 g），CXR 雙側肺泡浸潤。",
steps:[
{q:"鑑別診斷？",a:[
"這是<b>肺腎症候群</b>（瀰漫性肺泡出血＋腎絲球腎炎）；依機轉分類：",
"ANCA 相關血管炎：GPA（上呼吸道鼻痂鞍鼻＋肺結節空洞＋腎）、MPA（腎＋肺出血）——本例鼻痂、體重減輕、老年，最可能。",
"anti-GBM 病（Goodpasture）：吸菸、快速惡化；SLE（年輕女性、低補體）；cryoglobulinemia（HCV、紫斑、低 C4）；IgA 血管炎（紫斑、腹痛）。",
"非免疫性的假象要先想：感染性心內膜炎（發燒、心雜音、栓塞，且可 ANCA 陽性）、肺炎併急性腎損傷、心衰竭肺水腫＋腎前性、HUS/TTP、抗凝相關出血、腎靜脈血栓／APS。"],refs:[23045170]},
{q:"檢查怎麼開？怎麼快速區分？",a:[
"腎：尿沉渣（變形紅血球、紅血球圓柱＝腎絲球性）、UPCR、Cr 動態、腎臟超音波。",
"抗體同時送：ANCA（PR3/MPO）、anti-GBM、ANA/anti-dsDNA、C3/C4、cryoglobulin、HBV/HCV、抗磷脂抗體；血液培養 ×3 與心臟超音波排除心內膜炎。",
"肺：CT 胸部（磨玻璃、結節、空洞）；Hb 下降＋新浸潤＋DLCO 上升支持肺泡出血；支氣管鏡 BAL 逐次變血；喀血可缺席。",
"腎切片：pauci-immune 新月體（AAV）、線狀 IgG（anti-GBM）、full-house 免疫沉積（SLE）——盡快做，但不因等切片延誤治療。"],refs:[23045170,35110333]},
{q:"PR3-ANCA 陽性、anti-GBM 陰性、切片 pauci-immune 新月體腎絲球腎炎。診斷？急迫性？",a:[
"肉芽腫性多血管炎（GPA）合併肺腎症候群，屬器官與生命威脅：數日內可能洗腎或呼吸衰竭。",
"立刻通知風濕科、腎臟科與 ICU；穩定呼吸與循環、備血、避免延誤。",
"判讀提醒：ANCA 陰性不排除 AAV（約 10%）；ANCA 陽性也見於心內膜炎、藥物（hydralazine、PTU、levamisole）、IBD。"],refs:[35110333,34235894]},
{q:"治療原則（內科層級）？",a:[
"誘導：pulse 類固醇＋ rituximab 或 cyclophosphamide（專科決定）；併 anti-GBM 或嚴重腎衰竭考慮血漿置換；需要時透析。",
"同時：PJP 預防（TMP-SMX）、HBV 與結核篩檢、疫苗、骨質保護；追蹤尿沉渣、Cr、CBC。",
"維持：rituximab 或 azathioprine ≥18–24 個月；復發率高需長期追蹤，PR3 陽性復發更多。"],refs:[36927642,34235894]}
]},

{id:"c6",title:"48 歲女性，手指遇冷變色、皮膚變緊與指尖潰瘍",desc:"雷諾氏現象原發 vs 次發 → SSc 的抗體與器官篩檢 → 腎危象的辨識",
vig:"48 歲女性，2 年來手指遇冷變白、變紫、再變紅；近半年雙手手指腫脹、皮膚變緊變硬，指尖出現疼痛性小潰瘍，並有胃食道逆流與活動性喘。BP 128/80。理學：雙手指皮膚增厚至 MCP 近端、指尖凹陷性疤痕、臉部毛細血管擴張。",
steps:[
{q:"雷諾氏現象的鑑別？哪些線索指向次發性？",a:[
"原發性（約 80–90%）：<30 歲發病、對稱、無潰瘍或組織壞死、甲床微血管正常、ANA 陰性、ESR 正常。",
"次發性——結締組織病：全身性硬化症最典型，另 MCTD、SLE、皮肌炎、Sjögren、RA；血管炎；血液（cryoglobulinemia、真性紅血球增多症）；藥物（β 阻斷劑、麥角、bleomycin、安非他命）；職業振動；甲狀腺功能低下；閉塞性血管病（吸菸者 Buerger 病、動脈硬化、胸廓出口症候群——常不對稱）。",
"本例：>30 歲發病、指端潰瘍、皮膚硬化、毛細血管擴張、逆流 → 次發性，高度懷疑全身性硬化症。"],refs:[24122180]},
{q:"檢查與判讀？確診後每個 SSc 病人都要篩檢什麼？",a:[
"ANA（SSc >90% 陽性；著絲點或核仁型態）；anti-centromere（局限型、PAH）、anti-Scl-70（瀰漫型、ILD）、anti-RNA polymerase III（瀰漫型、腎危象、同步癌症）；甲床微血管鏡（巨大微血管、出血、缺血區）。",
"CBC、Cr、尿液、CK（重疊肌炎）、TSH；非典型時查 cryoglobulin、蛋白電泳。",
"器官篩檢（每年）：PFT（FVC、DLCO）＋HRCT 找 ILD；心臟超音波＋NT-proBNP 找 PAH（確診需右心導管）；心電圖；上消化道症狀評估。",
"2013 ACR/EULAR 分類：雙手指皮膚增厚延伸至 MCP 近端即 9 分（充分條件）。"],refs:[24122180]},
{q:"半年後她突然頭痛、視力模糊，BP 190/115，Cr 由 0.8 升至 2.4，抹片見破碎紅血球。發生什麼事？怎麼處理？",a:[
"硬皮症腎危象：新發惡性高血壓＋急性腎損傷＋微血管溶血；危險因子為瀰漫型早期、anti-RNA polymerase III、近期 prednisone ≥15 mg/d。",
"鑑別：TTP/HUS（ADAMTS13）、其他原因惡性高血壓、急性腎絲球腎炎。",
"處置：立即 ACEi（captopril）並快速上調，Cr 上升仍續用，必要時透析（部分可脫離）；避免高劑量類固醇；當日住院、專科共管。"],refs:[11033587,39874231]},
{q:"一般治療原則？",a:[
"雷諾與潰瘍：保暖、戒菸、鈣離子阻斷劑第一線；潰瘍用 PDE5 抑制劑、前列腺素；胃食道逆流用 PPI。",
"ILD：mycophenolate 第一線（可併抗纖維化 nintedanib）；PAH：專科標靶治療；皮膚：MTX 或 MMF。",
"沒有能逆轉整體病程的藥，重點是每年篩檢 ILD 與 PAH、與風濕科共同照護。"],refs:[39874231]}
]},

{id:"c7",title:"52 歲女性，眼瞼紫紅疹、近端無力與喘",desc:"近端無力＋CK 高的鑑別 → 肌炎檢查與癌症篩檢（台灣）→ MDA5 警訊",
vig:"52 歲女性，2 個月來眼瞼紫紅色皮疹、指節背側鱗屑性丘疹、梳頭與上樓困難，近 2 週乾咳與活動性喘。CK 2,800 U/L、AST 120、ALT 95。",
steps:[
{q:"鑑別診斷？（把皮疹與無力分開想）",a:[
"「近端無力＋CK 高」：發炎性肌病（皮肌炎、多發性肌炎、免疫介導壞死性肌病 anti-SRP/anti-HMGCR、抗合成酶症候群、包涵體肌炎——老年、遠端手指屈肌、CK 輕度）；內分泌（甲狀腺功能低下、Cushing）；藥物毒物（statin、酒精、colchicine、hydroxychloroquine；類固醇肌病 CK 正常）；電解質（低鉀、低磷）；感染（病毒性肌炎、HIV）；遺傳性肌病；橫紋肌溶解。",
"神經肌肉鑑別：重症肌無力、Lambert-Eaton、運動神經元病——CK 不高、有波動或反射異常。",
"AST/ALT 上升在此是肌肉來源，不要誤判為肝炎（查 CK、aldolase、GGT）。",
"皮疹鑑別：heliotrope 與 Gottron 為皮肌炎特徵；SLE 手部紅斑在指間、蝶形疹避開鼻唇溝；乾癬、接觸性與脂漏性皮膚炎。皮疹＋肌病＋喘 → 皮肌炎合併 ILD 最可能。"],refs:[29079590,21360500]},
{q:"檢查怎麼開？要特別排除什麼？",a:[
"肌肉：CK、aldolase、LDH、TSH、電解質；EMG（肌病性變化）；大腿 MRI（水腫）；肌肉切片（束周萎縮、血管周圍發炎）。",
"抗體：ANA、肌炎特異抗體（Jo-1 等抗合成酶、MDA5、TIF1γ、NXP2、Mi-2、SRP、HMGCR）——決定表現型、併發症與預後。",
"肺與心：HRCT＋PFT（含 DLCO）；心電圖、troponin、心臟超音波；吞嚥評估（吸入性肺炎）。",
"惡性腫瘤：皮肌炎在診斷前後 3 年風險最高；台灣以鼻咽癌最常見 → 鼻咽鏡＋頭頸影像，加 CT 胸腹骨盆與年齡相關篩檢（乳房、子宮頸、大腸）；anti-TIF1γ 或 anti-NXP2 陽性者最積極。"],refs:[29079590,11298544,27210465,21953614]},
{q:"若 CK 正常、ferritin 3,000、手掌側疼痛性丘疹、皮膚潰瘍且喘快速惡化，你想到什麼？",a:[
"anti-MDA5 陽性的臨床無肌病性皮肌炎合併快速進展 ILD——東亞常見、死亡率高，是急症。",
"處置原則：立即住院、風濕與胸腔科共管，早期強力免疫抑制（高劑量類固醇＋ calcineurin 抑制劑＋ cyclophosphamide 三合一），同時 PJP 預防並排除感染（PJP、CMV）。"],refs:[15880816,31524333]},
{q:"一般治療原則？",a:[
"第一線高劑量類固醇（prednisolone 1 mg/kg），早期加省類固醇藥（MTX 或 azathioprine；ILD 用 mycophenolate 或 tacrolimus）；難治或吞嚥困難用 IVIG。",
"復健、防曬、吸入性肺炎預防、骨質保護；治療反應看肌力與功能，不只看 CK。"],refs:[36198179]}
]},

{id:"c8",title:"26 歲男性，晨間下背痛與曾發作的紅眼",desc:"下背痛：發炎性 vs 機械性與紅旗 → HLA-B27 與影像判讀 → axSpA 治療原則與併發症",
vig:"26 歲男性，1 年多來下背與臀部痛，清晨最嚴重、活動後改善，晨僵約 45 分鐘，半夜痛醒需起身活動；曾有一次急性紅眼畏光，眼科診斷前葡萄膜炎；無發燒或體重減輕。CRP 1.8 mg/dL。",
steps:[
{q:"慢性下背痛的鑑別？哪些是紅旗？",a:[
"先分「發炎性 vs 機械性」：發炎性背痛——發病 <40 歲、隱匿、運動改善、休息不改善、夜間痛（≥4/5），晨僵 >30 分；本例符合。",
"發炎性：中軸型脊椎關節炎（AS）、乾癬性、IBD 相關、反應性關節炎；機械性：椎間盤、小面關節、肌筋膜、脊椎滑脫；其他：DISH（老年）、纖維肌痛、Scheuermann 病。",
"紅旗必排除：感染（脊椎骨髓炎、結核性脊椎炎、硬膜外膿瘍——發燒、靜脈藥癮、免疫低下）、惡性腫瘤（>50 歲、體重減輕、夜間痛不緩解、癌症史）、骨折（骨鬆、類固醇、外傷）、馬尾症候群（鞍部麻木、大小便失禁）、轉移痛（主動脈瘤、腎、胰）。"],refs:[19297344]},
{q:"檢查與判讀？HLA-B27 陽性代表什麼？",a:[
"骨盆／骶髂關節 X 光（modified New York：雙側 ≥2 級或單側 ≥3 級）；早期常正常 → 骶髂關節 MRI（STIR 骨髓水腫）。",
"HLA-B27：台灣一般人約 5–6% 陽性、AS 病人 >90%——陽性只是「支持」，陰性不排除，不能單獨診斷；CRP/ESR 半數正常。",
"找其他 SpA 特徵：葡萄膜炎、乾癬（含指甲、頭皮）、IBD 症狀、指趾炎、附著點炎（阿基里斯腱、足底筋膜）、家族史、NSAID 反應。",
"ASAS 分類：背痛 ≥3 月且發病 <45 歲；影像路徑（骶髂炎＋≥1 特徵）或臨床路徑（B27＋≥2 特徵）；本例有葡萄膜炎、家族史、CRP、發炎性背痛。"],refs:[19297344]},
{q:"診斷確立後，內科層級的治療原則？",a:[
"衛教、規律運動與物理治療、戒菸；NSAID 第一線且持續足量，常有戲劇性反應；sulfasalazine 只對周邊關節炎有幫助；全身性類固醇不建議。",
"NSAID 無效或不耐 → 轉風濕科考慮生物製劑（TNF 或 IL-17 抑制劑）或 JAK 抑制劑；有葡萄膜炎或 IBD 傾向選單株抗體 TNF 抑制劑，IBD 禁 IL-17 抑制劑。",
"急性紅眼要當天看眼科（葡萄膜炎）。"],refs:[36270658]},
{q:"這類病人有哪些內科要注意的併發症？",a:[
"脊椎骨折：僵直脊椎在低能量外傷也可能骨折且不穩定，外傷後新發頸／背痛要做 CT；骨質疏鬆。",
"心血管：主動脈瓣閉鎖不全、傳導阻滯；肺：上葉纖維化、胸廓活動度下降；腎：IgA 腎病、澱粉樣變性（少見）；長期 NSAID 的腎與腸胃風險。"],refs:[36270658]}
]},

{id:"c9",title:"32 歲女性，深部靜脈栓塞與反覆流產",desc:"年輕人血栓與反覆流產的鑑別 → aPL 判讀與抽血陷阱 → 抗凝選擇與 CAPS 辨識",
vig:"32 歲女性，因左小腿腫痛診斷 DVT。過去兩次 10 週前流產與一次 24 週死胎；未服避孕藥，無手術或長途旅行，不吸菸。PLT 105,000、ANA 1:160。",
steps:[
{q:"年輕人靜脈血栓與反覆流產的鑑別？",a:[
"血栓危險因子框架——後天：不動、手術、雌激素、懷孕產褥、肥胖、惡性腫瘤、腎病症候群、發炎性腸病、感染、HIT、PNH、骨髓增生性腫瘤；遺傳性血栓傾向：東亞以 protein S/C、antithrombin 缺乏為主，Factor V Leiden 罕見。",
"自體免疫：抗磷脂質症候群（原發或次發於 SLE）、Behçet（血管型）、血管炎。",
"反覆流產：APS、子宮結構異常、染色體異常、內分泌（甲狀腺、糖尿病、高泌乳素）、感染。",
"「血栓＋反覆流產（尤其晚期）＋血小板低＋ANA 陽性」→ APS 最可能，並要評估是否有 SLE。"],refs:[16420554]},
{q:"檢查與判讀？抽血時機有什麼陷阱？",a:[
"抗磷脂抗體三項：lupus anticoagulant（功能性檢驗，抗凝會干擾 → 於抗凝前抽或依實驗室建議）、aCL IgG/IgM、anti-β2GPI IgG/IgM；需中高效價且 12 週後複驗（感染或藥物可短暫陽性）。",
"三重陽性＝最高風險；LA 與臨床事件最相關。",
"併查 ANA、anti-dsDNA、C3/C4、CBC、Coombs、尿液（次發性 SLE）；急性期與抗凝中遺傳性血栓傾向判讀受影響；基本癌症篩檢。",
"分類：Sydney 2006（臨床＋實驗室各 ≥1）；2023 ACR/EULAR 加權（臨床 ≥3 分且實驗室 ≥3 分）。"],refs:[16420554,37635643]},
{q:"三重陽性確認。抗凝怎麼選？懷孕怎麼辦？",a:[
"靜脈血栓：warfarin INR 2–3 長期；三重陽性或動脈血栓不用 DOAC（rivaroxaban 試驗血栓事件顯著較高而提前終止）。",
"懷孕：warfarin 致畸 → 改治療劑量 LMWH＋低劑量 aspirin，產後 6–12 週再回 warfarin；僅產科 APS 無血栓者用 aspirin＋預防劑量 LMWH；避免含雌激素避孕。",
"血小板低通常輕度，<50,000 才需處理。"],refs:[31092409,30002145,32090480]},
{q:"什麼情況要想到災難性 APS？",a:[
"一週內 ≥3 個器官小血管血栓（腎、肺、腦、心、皮膚、腎上腺），常有誘因（感染、手術、停抗凝、產褥）；死亡率 30–50%。",
"鑑別：TTP/HUS、DIC、HIT、敗血症、惡性高血壓。",
"處置：抗凝＋高劑量類固醇＋血漿置換或 IVIG，處理誘因，ICU 與風濕科共管。"],refs:[12892393]}
]},

{id:"c10",title:"35 歲男性，每晚高燒、咽痛與鮭魚色皮疹",desc:"不明熱的鑑別 → 排除性診斷的檢查順序 → AOSD 治療原則與 MAS 辨識",
vig:"35 歲男性，3 週每晚 39.5°C 尖峰型發燒、白天退燒，咽痛、雙腕與膝關節痛，發燒時軀幹出現淡粉色斑疹。WBC 18,000（中性球 88%）、ferritin 6,500 ng/mL、AST/ALT 上升，RF/ANA 陰性，血液培養 ×3 陰性，CT 見輕度肝脾與淋巴結腫大。",
steps:[
{q:"鑑別診斷？",a:[
"框架：年輕成人不明熱＋皮疹＋咽痛＋關節痛＋白血球高＋ferritin 極高。",
"感染：EBV/CMV、急性 HIV、感染性心內膜炎、結核、深部膿瘍、傷寒、恙蟲病與立克次體（台灣，找焦痂）、登革熱；急性風濕熱（咽炎後遊走性關節炎）。",
"惡性：淋巴瘤（B 症狀、淋巴結）、白血病。",
"自體免疫與自體發炎：成人 Still 病、SLE、血管炎（PAN）、Kikuchi 病（年輕亞洲女性、頸部淋巴結、發燒，自限）、反應性關節炎、藥物過敏 DRESS（藥物史、嗜酸球、肝炎）。",
"支持 AOSD 的線索：每日一次尖峰型發燒且退燒後如常、發燒時出現又消退的鮭魚色斑疹、咽痛、中性球增多、ferritin >5× ULN、RF/ANA 陰性——但 AOSD 是排除性診斷。"],refs:[1578458]},
{q:"檢查怎麼排？何時做淋巴結切片或骨髓？",a:[
"感染：血液培養 ×3、EBV/CMV/HIV/HBV/HCV、恙蟲病與傷寒血清、IGRA、心臟超音波、CT 找膿瘍。",
"自體免疫：ANA、RF、ANCA、補體、ferritin（與 glycosylated ferritin <20%）、CK、肝功能、凝血。",
"腫瘤：CT 頸胸腹骨盆、LDH；淋巴結持續腫大或血球低 → 淋巴結切片（Kikuchi 或淋巴瘤）與骨髓檢查（噬血、白血病）。",
"Yamaguchi：主要 4 項（發燒 ≥39°C ≥1 週、關節痛 ≥2 週、典型皮疹、白血球 ≥10,000 且中性球 ≥80%）＋次要（咽痛、淋巴結或脾腫大、肝功能異常、RF/ANA 陰性），≥5 項含 ≥2 主要，且排除感染、腫瘤、其他風濕病。"],refs:[1578458,39317417]},
{q:"排除後確診 AOSD。治療原則？",a:[
"NSAID 少數有效；多數需類固醇（0.5–1 mg/kg），器官侵犯用 pulse；早期加 MTX 或 IL-1／IL-6 抑制劑省類固醇（專科）；生物製劑前篩 TB/HBV。",
"追蹤 ferritin、肝功能、血球；衛教可能為單次、復發型或慢性關節型。"],refs:[39317417]},
{q:"治療第 2 週再發燒、PLT 降至 70,000、ESR 由 90 降到 15、ferritin 升到 28,000、fibrinogen 120。發生什麼事？",a:[
"巨噬細胞活化症候群（次發性 HLH）：ESR 反常下降（fibrinogen 消耗）＋ferritin 飆升＋血球下降＋TG 上升＋肝酶上升；2016 標準 ferritin >684 且 ≥2 項（PLT ≤181、AST >48、TG >156、fibrinogen ≤360）；HScore 可輔助。",
"鑑別：敗血症與 DIC、藥物反應、疾病本身惡化；找誘因（EBV、CMV、細菌感染）。",
"急症：pulse 類固醇＋ anakinra ± cyclosporine（專科），難治 etoposide；輸血、DIC 處置、ICU；不可延誤。"],refs:[26865703,24782338]}
]},

{id:"c11",title:"38 歲女性，清晨四肢無力與嚴重低血鉀",desc:"低血鉀性麻痺的鑑別（台灣最常見的是什麼？）→ 腎小管酸血症 → Sjögren 的診斷與併發症",
vig:"38 歲女性，清晨醒來四肢無力無法起床，意識清楚。K 1.9 mmol/L、Na 138、Cl 115、HCO3 14、BUN/Cr 正常；動脈血 pH 7.28；尿 pH 6.5。過去 2 年常口乾眼乾、蛀牙增加，曾兩側腮腺腫。",
steps:[
{q:"低血鉀性麻痺的鑑別？怎麼分類？",a:[
"先分「轉移型 vs 腎外流失 vs 腎性流失」：看尿鉀（尿 K/Cr 或 TTKG）與酸鹼狀態。",
"轉移型（總量不缺）：甲狀腺毒性週期性麻痺（<b>台灣最常見</b>，年輕男性、高碳水或運動後、TSH 低）、家族性低血鉀週期性麻痺、胰島素、β 促效劑、鹼血症。",
"腎外流失：腹瀉、瀉劑、嘔吐（多伴代謝性鹼中毒）。",
"腎性流失：利尿劑、原發性醛固酮症（高血壓＋低鉀＋代謝性鹼）、Gitelman/Bartter（鹼中毒）、腎小管酸血症（高氯性代謝性酸中毒）、低鎂、amphotericin B。",
"本例：正常陰離子間隙的高氯性代謝性酸中毒＋低鉀＋尿 pH >5.5 → 遠端（第 1 型）腎小管酸血症；成人 dRTA 首先想 Sjögren 症候群，其次高鈣尿與腎鈣化、藥物（amphotericin、鋰）、自體免疫肝病、髓質海綿腎、遺傳。"],refs:[27785888]},
{q:"檢查怎麼開？如何確立 Sjögren？腮腺腫的鑑別？",a:[
"電解質與酸鹼：血鉀、氯、碳酸氫根、陰離子間隙、尿陰離子間隙（正值支持 dRTA）、尿 pH、24 小時尿鈣、腎臟超音波（腎鈣化或結石）、TSH。",
"乾燥症客觀證據：Schirmer 試驗（≤5 mm/5 分）、眼表染色評分（OSS ≥5）、非刺激唾液流速（≤0.1 mL/分）、anti-SSA/Ro、唇腺切片（focus score ≥1）；2016 ACR/EULAR ≥4 分（anti-SSA 與唇腺各 3 分，其餘各 1 分）；需排除 HCV、HIV、頭頸放射治療、IgG4 相關疾病、類肉瘤病、GVHD。",
"併查：CBC、RF（常陽性）、ANA、IgG（高球蛋白血症）、C3/C4、cryoglobulin、尿蛋白（腎小管間質腎炎）、CXR（ILD）。",
"腮腺腫的鑑別：Sjögren、IgG4 相關疾病、類肉瘤病、病毒或細菌性腮腺炎、淋巴瘤、HIV、酒精與糖尿病的 sialadenosis。"],refs:[27785888]},
{q:"anti-SSA 陽性、Schirmer 3 mm、唇腺切片 focus score 2。診斷？長期要注意什麼？",a:[
"原發性 Sjögren 症候群合併遠端腎小管酸血症（腎小管間質腎炎）。",
"全身表現：關節炎、間質性肺病、周邊神經病變、紫斑（cryoglobulinemia）、腎絲球腎炎、自體免疫肝病與 PBC、甲狀腺炎。",
"淋巴瘤（風險約 5–10%，多為 MALT 型）紅旗：持續腮腺腫大、紫斑、低 C4、cryoglobulin、單株球蛋白、淋巴結腫大、血球低 → 切片。",
"育齡女性 anti-Ro 陽性：懷孕時胎兒心臟傳導阻滯風險 → 16–26 週胎兒心臟超音波、續用 HCQ。"],refs:[27785888,31672775,32090480]},
{q:"治療原則？",a:[
"低血鉀性麻痺急性期：補鉀（口服為主，嚴重或心律不整者靜脈並監測心電圖）；長期以碳酸氫鈉或檸檬酸鉀矯正酸血症並補鉀。",
"乾燥症：人工淚液、唾液促進劑（pilocarpine）、口腔衛生；全身病變：HCQ（關節、皮膚），類固醇與免疫抑制劑（腎、肺、神經），嚴重全身病變或淋巴瘤用 rituximab。",
"定期追蹤淋巴瘤警訊、腎功能與電解質。"],refs:[31672775]}
]}
];

/* ===================== 邏輯 ===================== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const pmid = id => `<a class="pmid" href="https://pubmed.ncbi.nlm.nih.gov/${id}/" target="_blank" rel="noopener" title="${esc(REFS[id] || "")}">PMID ${id}</a>`;
const refLine = ids => ids && ids.length ? `<div class="refs">文獻：${ids.map(pmid).join("")}</div>` : "";

const state = { done: new Set() };
const cs = { cur: null, step: 0, timerId: null, left: 60 };

function renderProg() {
  const n = state.done.size;
  $("#prog").textContent = n === CASES.length ? `${CASES.length} 個病例全部完成。可按「重設進度」再練一輪。` : `已完成 ${n} / ${CASES.length} 個病例`;
}
function renderCaseList() {
  $("#case-list").innerHTML = CASES.map((c, i) => `<button type="button" class="case-item${state.done.has(c.id) ? " done" : ""}" data-id="${c.id}"><span class="n">${i + 1}</span><span><span class="t">${c.title}</span><span class="d">${c.desc}</span></span></button>`).join("");
  $$("#case-list .case-item").forEach(b => b.addEventListener("click", () => openCase(b.dataset.id)));
  renderProg();
}
function stopTimer() { if (cs.timerId) { clearInterval(cs.timerId); cs.timerId = null; } }
function startTimer() {
  stopTimer();
  const t = $("#timer");
  if (!t) return;
  if (!$("#case-timer-on").checked) { t.textContent = ""; t.classList.remove("low"); return; }
  cs.left = 60;
  t.textContent = "60 秒"; t.classList.remove("low");
  cs.timerId = setInterval(() => {
    cs.left--;
    t.textContent = cs.left > 0 ? `${cs.left} 秒` : "時間到，請作答";
    if (cs.left <= 10) t.classList.add("low");
    if (cs.left <= 0) stopTimer();
  }, 1000);
}
function openCase(id) {
  cs.cur = CASES.find(c => c.id === id);
  cs.step = 0;
  $("#case-list").hidden = true;
  $(".fc-bar").hidden = true;
  renderCase();
}
function renderCase() {
  const c = cs.cur, s = c.steps[cs.step], last = cs.step === c.steps.length - 1;
  const idx = CASES.indexOf(c);
  $("#case-view").innerHTML = `<div class="case">
<p class="small muted">病例 ${idx + 1} / ${CASES.length}</p>
<h3>${c.title}</h3>
<p class="vig">${c.vig}</p>
<div class="step">
<p class="q">${s.q}<span class="timer" id="timer"></span></p>
<p class="small muted">先大聲說出你的回答，再看參考答案。</p>
<button type="button" class="btn primary" id="reveal">顯示參考答案</button>
<div class="ans" id="ans" hidden><ul>${s.a.map(x => `<li>${x}</li>`).join("")}</ul>${refLine(s.refs)}</div>
</div>
<div class="case-nav">
<span class="small">第 ${cs.step + 1} / ${c.steps.length} 題</span>
<span>
<button type="button" class="btn" id="case-back">回到列表</button>
<button type="button" class="btn primary" id="case-next" disabled>${last ? "完成病例" : "下一題"}</button>
</span></div></div>`;
  $("#reveal").addEventListener("click", () => { $("#ans").hidden = false; $("#reveal").disabled = true; $("#case-next").disabled = false; stopTimer(); $("#timer").textContent = ""; });
  $("#case-next").addEventListener("click", () => {
    if (last) { state.done.add(c.id); renderDone(); }
    else { cs.step++; renderCase(); }
  });
  $("#case-back").addEventListener("click", closeCase);
  startTimer();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function renderDone() {
  stopTimer();
  const c = cs.cur, idx = CASES.indexOf(c);
  const nextC = CASES.find((x, i) => i > idx && !state.done.has(x.id)) || CASES.find(x => !state.done.has(x.id));
  $("#case-view").innerHTML = `<div class="case">
<h3>完成：${c.title}</h3>
<p class="small">回想一下：這個病例的三個關鍵句你能不看答案說出來嗎？說不出來就再做一次。</p>
<p class="small muted">已完成 ${state.done.size} / ${CASES.length} 個病例</p>
<div class="case-nav">
<span>
<button type="button" class="btn" id="case-redo">再做一次</button>
<button type="button" class="btn" id="case-back">回到列表</button>
</span>
<span>${nextC ? `<button type="button" class="btn primary" id="case-go-next">下一個病例</button>` : ""}</span>
</div></div>`;
  $("#case-redo").addEventListener("click", () => openCase(c.id));
  $("#case-back").addEventListener("click", closeCase);
  const nb = $("#case-go-next"); if (nb) nb.addEventListener("click", () => openCase(nextC.id));
  renderProg();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function closeCase() { stopTimer(); cs.cur = null; $("#case-view").innerHTML = ""; $("#case-list").hidden = false; $(".fc-bar").hidden = false; renderCaseList(); }
$("#case-timer-on").addEventListener("change", () => { if (cs.cur && $("#timer")) startTimer(); });
$("#case-random").addEventListener("click", () => {
  const pool = CASES.filter(c => !state.done.has(c.id));
  const pick = (pool.length ? pool : CASES)[Math.floor(Math.random() * (pool.length ? pool : CASES).length)];
  openCase(pick.id);
});
$("#case-reset").addEventListener("click", () => { state.done.clear(); renderCaseList(); });

/* ---- 文獻 ---- */
(function renderRefs() {
  const ids = []; CASES.forEach(c => c.steps.forEach(s => (s.refs || []).forEach(r => { if (!ids.includes(r)) ids.push(r); })));
  $("#ref-list").innerHTML = `<ol>${ids.map(r => `<li>${esc(REFS[r] || "")} ${pmid(r)}</li>`).join("")}</ol>`;
  $("#ref-count").textContent = `${ids.length} 篇`;
})();
renderCaseList();

</script>
</body>
</html>
