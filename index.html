<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>免疫風濕科 口試模擬｜台灣內科專科醫師口試</title>
<meta name="description" content="台灣內科專科醫師口試前的免疫風濕科口試模擬：10 個病例、30 題，以以一般內科醫師的基本門檻設計、鑑別診斷為主軸，逐題出現、60 秒倒數，附參考答案與 PubMed 文獻。">
<style>
:root{
  --paper:#F3F5F7; --sheet:#FFFFFF; --ink:#17212B; --ink2:#4A5866; --ink3:#7A8794;
  --rule:#D5DCE3; --rule2:#E9EEF2;
  --teal:#0B6E7A; --teal2:#095A64; --tealsoft:#E3F1F3;
  --mark:#FFE86B; --red:#B8232F; --redsoft:#FBE9EA; --green:#2F7D4F; --greensoft:#E6F3EA;
  --maxw:760px; --r:6px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.7}
a{color:var(--teal2)}
a:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
h1,h2,h3,h4{line-height:1.3;margin:0}
h1{font-size:clamp(22px,5.2vw,30px);font-weight:700;letter-spacing:.01em}
h2{font-size:clamp(19px,4.4vw,24px);font-weight:700;margin:28px 0 12px}
h3{font-size:17px;font-weight:700;margin:20px 0 8px}
h4{font-size:15px;font-weight:700;color:var(--ink2);margin:14px 0 4px}
p{margin:0 0 10px}
ul,ol{margin:0 0 10px;padding-left:1.3em}
li{margin:4px 0}
li::marker{color:var(--ink3)}
mark{background:linear-gradient(transparent 32%,var(--mark) 32%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 .12em;border-radius:2px}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:8px 14px;cursor:pointer;line-height:1.3;min-height:40px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal2)}
.btn.good{background:var(--greensoft);border-color:var(--green);color:var(--green)}
.btn.warn{background:var(--redsoft);border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:14px;color:var(--ink2)}
.muted{color:var(--ink3)}
.tag{display:inline-block;font-size:12.5px;line-height:1;padding:5px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.tag.hi{border-color:var(--teal);color:var(--teal)}
.tag.emerg{border-color:var(--red);color:var(--red)}
.pmid{font-size:13.5px;color:var(--teal2);text-decoration:none;border-bottom:1px solid var(--rule);margin-right:8px;white-space:nowrap}
.pmid:hover{border-bottom-color:var(--teal)}
.refs{font-size:13.5px;color:var(--ink2);margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule)}

/* header */
.top{background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10}
.top .wrap{padding-top:14px}
.sub{font-size:14px;color:var(--ink2);margin:6px 0 4px}
.prog{font-size:13px;color:var(--ink3);margin:0 0 8px;min-height:1.4em}
.tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 12px;max-width:var(--maxw);margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--ink2);cursor:pointer;font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--teal2);border-bottom-color:var(--teal);font-weight:700}
main{padding:16px 0 64px}
section[role="tabpanel"][hidden]{display:none}

/* ten-minute sheet: the one loud element */
.ten-wrap{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px 16px 8px;margin:8px 0 22px;position:relative}
.ten-wrap h2{margin:0 0 4px}
.ten-wrap .small{margin-bottom:10px}
ol.ten{padding-left:1.6em;margin:0}
ol.ten li{margin:8px 0;padding-left:.2em}
ol.ten li::marker{color:var(--teal);font-weight:700}

/* search + topic cards */
.search{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--sheet);margin:6px 0 10px}
.topic{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:var(--r);margin:10px 0;padding:0 14px}
.topic[data-freq="高"]{border-left-color:var(--teal)}
.topic[data-freq="中"]{border-left-color:#8FB8BE}
.topic summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 0;font-weight:700;font-size:16.5px}
.topic summary::-webkit-details-marker{display:none}
.topic summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(-45deg);flex:0 0 auto;transition:transform .15s}
.topic[open] summary::before{transform:rotate(45deg)}
.topic summary .name{flex:1}
.topic .body{padding:0 0 14px}
.topic .one{font-size:15.5px;color:var(--ink2);margin:0 0 6px;padding:8px 10px;background:var(--paper);border-radius:4px}
.topic ul{padding-left:1.2em}
.topic li{font-size:15px}
.topic li.urgent{border-left:3px solid var(--red);padding-left:8px;list-style:none;margin-left:-1.2em}
.topic li.tw{border-left:3px solid var(--mark);padding-left:8px;list-style:none;margin-left:-1.2em}
.legend{font-size:13px;color:var(--ink3);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 8px}

/* tables */
.tbl{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);margin:8px 0 18px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--rule2)}
th{background:var(--paper);font-weight:700;color:var(--ink2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;white-space:nowrap}
.tbl.wrapcol td:first-child{white-space:normal;min-width:7em}
.emerg td:first-child{border-left:3px solid var(--red)}

/* flashcards */
.fc-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.fc-bar select{font:inherit;padding:8px 10px;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--sheet);max-width:100%}
.fc{perspective:1200px;margin:6px 0 12px}
.fc-inner{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.is-flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px 18px 40px;display:flex;flex-direction:column}
.fc-face .lbl{font-size:13px;color:var(--ink3);margin-bottom:8px}
.fc-face .txt{font-size:17px;line-height:1.65;flex:1}
.fc-face .hint{position:absolute;bottom:12px;right:16px;font-size:12.5px;color:var(--ink3)}
.fc-a{transform:rotateY(180deg);border-left:4px solid var(--teal)}
.fc-a .txt{font-size:16px}
.fc-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.fc-actions .grp{display:flex;gap:8px}
.fc-status{margin:10px 0 0;font-size:14px;color:var(--ink2)}
.bar{height:6px;background:var(--rule2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}

/* cases */
.case-list{display:grid;gap:8px;margin:8px 0 16px}
.case-item.active{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}
.case-item{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.case-item:hover{border-color:var(--teal)}
.case-item .n{color:var(--teal);font-weight:700;flex:0 0 auto}
.case-item .t{font-weight:700}
.case-item .d{font-size:13.5px;color:var(--ink2);display:block;margin-top:2px}
.case-item.done .n::after{content:" ✓"}
.case{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.case .vig{background:var(--paper);border-radius:4px;padding:10px 12px;margin:8px 0 14px;font-size:15.5px}
.step{border-top:1px solid var(--rule2);padding:12px 0}
.step .q{font-weight:700;margin:0 0 8px}
.step .q::before{content:"主考官：";color:var(--teal);font-weight:700}
.step .ans{margin-top:8px;border-left:3px solid var(--teal);padding-left:10px}
.step .ans ul{margin:0;padding-left:1.1em}
.step .ans li{font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink2);margin-left:8px}
.timer.low{color:var(--red);font-weight:700}
.case-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:12px;align-items:center}

/* quiz */
.quiz{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.quiz .qn{font-size:13px;color:var(--ink3);margin-bottom:6px}
.quiz .qt{font-weight:700;font-size:16.5px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:var(--r);padding:10px 12px;cursor:pointer;line-height:1.5}
.opt:hover{border-color:var(--teal)}
.opt.correct{border-color:var(--green);background:var(--greensoft)}
.opt.wrong{border-color:var(--red);background:var(--redsoft)}
.opt:disabled{cursor:default;opacity:1}
.exp{margin-top:12px;border-left:3px solid var(--teal);padding-left:10px;font-size:15px}
.quiz-nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.score{font-size:18px;font-weight:700;margin:6px 0}

footer{border-top:1px solid var(--rule);padding:18px 0 40px;font-size:13px;color:var(--ink3)}
footer .wrap p{margin:0 0 6px}

@media (min-width:640px){
  body{font-size:17px}
  .topic li{font-size:15.5px}
  .fc-face .txt{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .fc-inner{transition:none}
  .bar i{transition:none}
  .topic summary::before{transition:none}
}
@media print{
  .top{position:static}
  .tabs,.search,.btn,.fc-bar{display:none}
  section[role="tabpanel"][hidden]{display:block}
  .topic{break-inside:avoid}
  .topic .body{display:block}
  details>summary::before{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>免疫風濕科 口試模擬</h1>
    <p class="sub">以<b>一般內科醫師的基本門檻</b>設計：10 個病例、30 題，每題先<b>鑑別診斷</b>（排序與理由），再談要問什麼、查什麼、怎麼解讀，最後才是內科層級的治療原則與轉介時機。先<b>大聲說出</b>回答再展開參考答案；每題附 60 秒倒數。點下方病例即可開始，提問與參考答案會出現在病例清單上方。</p>
    <p class="prog" id="prog"></p>
  </div>
</header>

<main class="wrap">
  <section aria-label="口試模擬">
    <div class="fc-bar">
      <label class="small"><input type="checkbox" id="case-timer-on" checked> 開啟 60 秒倒數</label>
      <button class="btn" id="case-random" type="button">隨機抽一個病例</button>
      <button class="btn" id="case-reset" type="button">重設進度</button>
    </div>
    <div id="case-view"></div>
    <div id="case-list" class="case-list"></div>
  </section>

  <details class="topic" id="refs-wrap">
    <summary><span class="name">本頁文獻</span><span class="tag" id="ref-count"></span></summary>
    <div class="body" id="ref-list"></div>
  </details>
</main>

<footer>
  <div class="wrap">
    <p>教學複習用途，非臨床決策依據；劑量與流程請以最新指引與院內規範為準。內容整理自 PubMed 收錄之分類標準、治療指引與關鍵研究。</p>
    <p>可直接發布：本檔為單一 HTML，無外部相依。完成進度只會保留在目前的瀏覽期間。</p>
  </div>
</footer>

/* ===================== 口試模擬病例 ===================== */
/* 難度：一般內科醫師的基本門檻。每個病例三題：鑑別診斷（排序＋理由）→ 要問／查什麼與如何解讀 → 診斷、急症警訊與內科層級的治療原則、轉介時機 */
const CASES = [
{id:"c1",title:"55 歲女性，8 週對稱性小關節腫痛",desc:"多關節炎的鑑別框架 → 檢查判讀 → 類風濕性關節炎的治療原則",
vig:"55 歲女性，8 週來雙手小關節（MCP、PIP）、雙腕與雙足對稱性腫痛，晨僵約 2 小時；無皮疹、無腹瀉或泌尿道症狀、無乾癬。理學檢查：雙手 MCP、PIP 腫脹壓痛，雙腕滑膜增厚，指甲正常。",
steps:[
{q:"鑑別診斷是什麼？怎麼排序、理由為何？",a:[
"先定性：<b>慢性（>6 週）、發炎性（晨僵 >1 小時、關節腫）、對稱性小關節多關節炎</b> → 首先想類風濕性關節炎。",
"其他要提：病毒性關節炎（parvovirus B19、B/C 型肝炎、登革熱；多在 6 週內自行緩解）、全身性紅斑狼瘡（年輕女性、皮疹、口腔潰瘍、血球低下）、乾癬性關節炎（乾癬、指甲病變、DIP 侵犯、不對稱）、反應性關節炎（腸胃道或泌尿道感染後、下肢大關節）、多關節痛風或假性痛風（老年、發作史、痛風石）。",
"非發炎性的退化性關節炎要能分開：DIP/PIP 骨性腫大、晨僵短。",
"排序理由：對稱小關節、晨僵 2 小時、已 8 週、沒有皮膚／腸道／泌尿道線索 → 類風濕性關節炎最可能。"],refs:[20872595]},
{q:"還要問什麼、查什麼？結果怎麼解讀？",a:[
"病史：乾癬與家族史、口乾眼乾、雷諾氏現象、光敏感、口腔潰瘍、腹瀉或尿道炎、B/C 型肝炎；理學：DIP 是否侵犯、指甲、頭皮與肚臍有無乾癬、皮下結節。",
"檢查：CBC、ESR/CRP、肝腎功能、尿液、RF 與 anti-CCP、ANA、B/C 型肝炎、尿酸；雙手雙足 X 光（侵蝕、關節旁骨質疏鬆）。",
"解讀：anti-CCP 特異度高（約 95%）；RF 也見於 C 型肝炎、乾燥症、老年人；兩者都陰性不排除類風濕性關節炎；ANA 低效價（1:80）在健康人也常見，要配合臨床。"],refs:[17548411]},
{q:"RF 與 anti-CCP 都高、CRP 升高、X 光尚無侵蝕。診斷與治療原則？",a:[
"類風濕性關節炎：符合 2010 ACR/EULAR 分類：≥1 個關節滑膜炎，關節數、血清學、發炎指數、病程四項計分 ≥6/10。",
"治療原則：確診就轉免疫風濕科，早期開始 methotrexate（每週一次、併葉酸），短期低劑量類固醇與 NSAID 控制症狀；治療不足再由專科升階生物製劑。",
"內科的功課：開免疫抑制藥前查 B 型肝炎（HBsAg、anti-HBc）與結核（IGRA、胸部 X 光），追蹤肝腎功能與血球；心血管風險與戒菸。"],refs:[20872595,34101376]}
]},

{id:"c2",title:"26 歲女性，發燒、關節痛、臉部紅疹與蛋白尿",desc:"多系統侵犯的鑑別 → ANA 判讀與腎臟切片時機 → 狼瘡的急症與治療原則",
vig:"26 歲女性，1 個月來低燒、倦怠、雙手小關節痛、臉頰紅疹（曬太陽後加重）、口腔無痛潰瘍，近 1 週腳踝水腫。血壓 142/90。尿液：蛋白 3+、紅血球 20~30/HPF、紅血球圓柱。Hb 9.8、白血球 3,200、血小板 96,000、Cr 0.9。",
steps:[
{q:"鑑別診斷？",a:[
"框架：<b>年輕女性＋多系統（發燒、關節、皮膚、口腔、腎、三系血球低下）</b> → 全身性紅斑狼瘡第一。",
"一定要排除感染：急性 HIV、parvovirus B19、EB 病毒、B/C 型肝炎、感染性心內膜炎、結核；狼瘡病人的發燒與血球低下也可能是感染，兩者可並存。",
"其他：藥物性狼瘡（hydralazine、isoniazid、minocycline 等）、其他結締組織病（皮肌炎、乾燥症）、IgA 血管炎、TTP（血小板低下＋溶血＋腎，看抹片有無破碎紅血球）、感染後腎絲球腎炎。",
"臉部紅疹鑑別：酒糟、脂漏性皮膚炎；狼瘡的蝶形紅斑會避開鼻唇溝。"],refs:[31383717]},
{q:"檢查怎麼開？ANA 陽性怎麼解讀？什麼時候要腎臟切片？",a:[
"抗體：ANA 是篩檢（敏感度 >95%，陰性幾乎排除；但特異度低，健康人也可低效價陽性）；anti-dsDNA（特異，且隨疾病活動度變化）、anti-Sm（最特異）、anti-Ro/La、抗磷脂抗體。",
"活動度與器官：C3/C4（活動時下降）、CBC 與抹片、尿沉渣、尿蛋白／肌酸酐比值或 24 小時尿蛋白、Cr、胸部 X 光、心電圖。",
"排除感染：血液培養、HIV、B/C 型肝炎；CRP 明顯升高偏感染（狼瘡發作時 CRP 通常不高）。",
"腎臟切片時機：蛋白尿 ≥0.5 g/天，尤其合併血尿、紅血球圓柱或 Cr 上升 → 轉腎臟科／免疫風濕科切片，決定分級與治療。"],refs:[31383717,40331662]},
{q:"ANA 1:640、anti-dsDNA 高、C3/C4 低、抹片無破碎紅血球、培養陰性。診斷？有哪些急症？治療原則？",a:[
"全身性紅斑狼瘡合併狼瘡性腎炎（2019 EULAR/ACR 分類：ANA ≥1:80 入門，再依臨床與免疫項目計分）。",
"急症警訊：腎功能快速惡化、癲癇或精神症狀（神經精神狼瘡）、肺泡出血、心包填塞、嚴重溶血或血小板低下、合併嚴重感染。",
"治療原則：所有狼瘡都用 hydroxychloroquine（羥氯奎寧）；發作用類固醇並盡快減量；狼瘡性腎炎由專科加免疫抑制劑（mycophenolate 或環磷醯胺）；同時控制血壓、用 ACEi/ARB 減蛋白尿、避免 NSAID。",
"衛教：防曬、疫苗、避孕（免疫抑制劑有致畸胎性）、懷孕要在病情穩定後並先評估。"],refs:[37827694,40331662]}
]},

{id:"c3",title:"45 歲男性，急性紅腫熱痛的膝關節與發燒",desc:"急性單關節炎：感染性 vs 結晶性 → 關節液判讀 → 痛風的降尿酸與台灣 HLA-B*5801",
vig:"45 歲男性，有高血壓與痛風病史（去年兩次腳趾發作），昨晚起右膝劇痛腫脹、無法承重，體溫 38.6°C。白血球 14,500、CRP 12 mg/dL、尿酸 9.2 mg/dL、Cr 1.4。",
steps:[
{q:"鑑別診斷？哪一個最不能漏？",a:[
"<b>急性單關節炎＋發燒＝感染性關節炎，直到證明不是</b>；痛風病史不能排除感染，兩者可共存。",
"感染性（金黃色葡萄球菌最常見；年輕性活躍者想淋菌）、結晶性（痛風、假性痛風）、外傷或血關節（服用抗凝血劑）、反應性關節炎。",
"要分清是關節內還是關節周圍（蜂窩性組織炎、滑囊炎）。"],refs:[17405973]},
{q:"第一步做什麼？關節液怎麼判讀？",a:[
"立刻關節穿刺（未抽液前不打關節內類固醇）並同時抽血液培養；關節液送細胞數與分類、Gram 染色、培養、偏光顯微鏡看結晶。",
"白血球：<2,000 非發炎性；2,000~50,000 發炎性（痛風、類風濕性關節炎）；>50,000 且嗜中性球 >90% 強烈提示感染，但痛風也可能這麼高。",
"Gram 染色陰性不能排除感染（敏感度約 50%）；看到尿酸結晶也不能排除感染；急性期血尿酸可能正常。"],refs:[17405973,26352873]},
{q:"關節液白血球 68,000、見尿酸結晶、Gram 染色陰性。怎麼處置？之後何時降尿酸？在台灣要注意什麼？",a:[
"當作「痛風合併可能感染」：經驗性抗生素（覆蓋金黃色葡萄球菌，MRSA 風險用 vancomycin）＋反覆抽吸引流，等培養結果再調整。",
"痛風急性期：NSAID 或低劑量秋水仙素（colchicine）；感染未排除前不用全身性類固醇；依腎功能調整劑量。",
"降尿酸適應症：一年 ≥2 次發作、痛風石、關節侵蝕；目標尿酸 <6 mg/dL；allopurinol 低劑量開始慢慢加，前 3~6 個月併用秋水仙素預防發作。",
"台灣重點：開 allopurinol 前先驗 HLA-B*5801（帶因率約 20%，陽性者嚴重皮膚藥物不良反應風險高）；陽性改 febuxostat 或 benzbromarone。"],refs:[32390306,15743917,26399967]}
]},

{id:"c5",title:"62 歲男性，喀血、血尿與快速惡化的腎功能",desc:"肺腎症候群的鑑別（含非免疫性假象）→ 抗體與切片判讀 → 急迫性與治療原則",
vig:"62 歲男性，1 個月來倦怠、體重減輕、鼻塞帶血痂，2 天前開始喀血。血壓 150/95、SpO2 91%。Cr 3.8（3 個月前 1.0），尿蛋白 2+、紅血球圓柱；Hb 8.5（較前下降 3 g/dL），胸部 X 光雙側肺泡浸潤。",
steps:[
{q:"鑑別診斷？",a:[
"這是<b>肺腎症候群</b>（肺泡出血＋腎絲球腎炎）。",
"免疫性：ANCA 相關血管炎（GPA、MPA；本例鼻痂、體重減輕、老年 → 最可能）、抗腎絲球基底膜疾病（Goodpasture）、全身性紅斑狼瘡、冷凝球蛋白血症（C 型肝炎）、IgA 血管炎。",
"非免疫性假象要先排除：感染性心內膜炎（發燒、心雜音，ANCA 也可能陽性）、肺炎合併急性腎損傷、心衰竭肺水腫加腎前性腎損傷、抗凝血劑造成的出血。"],refs:[23045170]},
{q:"檢查怎麼開？",a:[
"腎：尿沉渣（變形紅血球、紅血球圓柱＝腎絲球性）、尿蛋白、Cr 變化。",
"抗體同時送：ANCA（PR3/MPO）、抗腎絲球基底膜抗體、ANA/anti-dsDNA、C3/C4、B/C 型肝炎；血液培養與心臟超音波排除心內膜炎。",
"肺：胸部電腦斷層；Hb 下降＋新浸潤支持肺泡出血（喀血可缺席）；必要時支氣管鏡。",
"腎臟切片盡快安排，但不因等切片延誤治療。"],refs:[23045170,35110333]},
{q:"PR3-ANCA 陽性、抗 GBM 陰性、切片為新月體腎絲球腎炎。診斷？急迫性？治療原則？",a:[
"肉芽腫性多血管炎（GPA，舊稱 Wegener 氏肉芽腫）合併肺腎症候群，數日內可能洗腎或呼吸衰竭，屬急症。",
"立刻通知免疫風濕科、腎臟科與加護病房；治療原則：高劑量類固醇脈衝治療＋ rituximab 或環磷醯胺（專科決定）；合併抗 GBM 或嚴重腎衰竭考慮血漿置換；必要時透析。",
"同時：預防肺囊蟲肺炎（TMP-SMX）、B 型肝炎與結核篩檢；記得 ANCA 陰性不排除血管炎。"],refs:[35110333,34235894]}
]},

{id:"c6",title:"48 歲女性，手指遇冷變色、皮膚變緊與指尖潰瘍",desc:"雷諾氏現象原發 vs 次發 → 硬皮症的抗體與器官篩檢 → 腎危象的辨識",
vig:"48 歲女性，2 年來手指遇冷變白、變紫、再變紅；近半年雙手手指腫脹、皮膚變緊變硬，指尖出現疼痛性小潰瘍，並有胃食道逆流與活動性喘。血壓 128/80。理學：雙手指皮膚增厚延伸到 MCP 近端、指尖凹陷性疤痕、臉部微血管擴張。",
steps:[
{q:"雷諾氏現象的鑑別？哪些線索指向次發性？",a:[
"原發性（多數）：年輕發病、對稱、無潰瘍、ANA 陰性、ESR 正常。",
"次發性：結締組織病（全身性硬化症最典型，另 SLE、皮肌炎、乾燥症、混合性結締組織病）、藥物（β 阻斷劑、麥角）、職業性振動、甲狀腺功能低下、閉塞性血管病（吸菸者的柏格氏病、動脈硬化，常不對稱）、血液疾病（冷凝球蛋白血症、真性紅血球增多症）。",
"本例：>30 歲發病、指端潰瘍、皮膚硬化、微血管擴張、胃食道逆流 → 次發性，高度懷疑全身性硬化症（硬皮症）。"],refs:[24122180]},
{q:"檢查與判讀？確診後要定期篩檢什麼？",a:[
"ANA（硬皮症 >90% 陽性）、anti-centromere（局限型，易肺動脈高壓）、anti-Scl-70（瀰漫型，易間質性肺病）；CBC、Cr、尿液、CK（重疊肌炎）、TSH。",
"定期篩檢兩大死因：間質性肺病（肺功能含 DLCO＋高解析度電腦斷層）與肺動脈高壓（心臟超音波＋NT-proBNP，確診靠右心導管）。",
"分類標準：雙手指皮膚增厚延伸到 MCP 近端，單項即符合。"],refs:[24122180]},
{q:"半年後她突然頭痛、血壓 190/115、Cr 由 0.8 升到 2.4、抹片見破碎紅血球。發生什麼事？怎麼處理？一般治療原則？",a:[
"硬皮症腎危象：新發惡性高血壓＋急性腎損傷＋微血管病性溶血；瀰漫型早期與近期使用中高劑量類固醇是危險因子。鑑別 TTP/HUS。",
"處置：立即 ACEi（captopril）並快速加量，Cr 上升仍續用，必要時透析；避免高劑量類固醇；當天住院、專科共同照護。",
"一般原則：雷諾用保暖、戒菸、鈣離子阻斷劑；胃食道逆流用氫離子幫浦阻斷劑（PPI）；間質性肺病與肺動脈高壓由專科治療。"],refs:[11033587,39874231]}
]},

{id:"c7",title:"52 歲女性，眼瞼紫紅疹、近端無力與喘",desc:"近端無力＋CK 高的鑑別 → 肌炎檢查與癌症篩檢（台灣）→ 治療原則與急症警訊",
vig:"52 歲女性，2 個月來眼瞼紫紅色皮疹、指節背側鱗屑性丘疹、梳頭與上樓困難，近 2 週乾咳與活動性喘。CK 2,800 U/L、AST 120、ALT 95。",
steps:[
{q:"鑑別診斷？（把皮疹與無力分開想）",a:[
"「近端無力＋CK 高」：發炎性肌炎（皮肌炎、多發性肌炎、免疫介導壞死性肌病變）、甲狀腺功能低下、藥物（statin、酒精、秋水仙素）、電解質異常（低血鉀、低血磷）、病毒性肌炎、橫紋肌溶解症；老年、慢性且手指屈肌無力想包涵體肌炎。",
"神經肌肉疾病（重症肌無力、運動神經元疾病）CK 通常不高。",
"AST/ALT 上升在這裡是肌肉來源，別當成肝炎。",
"皮疹：眼瞼紫紅斑（heliotrope）與指節背側的 Gottron 丘疹是皮肌炎特徵；狼瘡的手部紅斑在指間、蝶形紅斑避開鼻唇溝。皮疹＋肌病＋喘 → 皮肌炎合併間質性肺病最可能。"],refs:[29079590]},
{q:"檢查怎麼開？要特別排除什麼？",a:[
"肌肉：CK、aldolase、LDH、TSH、電解質；肌電圖；必要時肌肉切片。",
"抗體：ANA、肌炎抗體（anti-Jo-1 提示合併間質性肺病；anti-MDA5 提示快速進展性肺病）。",
"肺與心：高解析度電腦斷層＋肺功能；心電圖、troponin；吞嚥評估（吸入性肺炎）。",
"惡性腫瘤：皮肌炎在診斷前後 3 年風險最高；台灣最常見的是鼻咽癌 → 鼻咽鏡＋頭頸部影像，加胸腹骨盆電腦斷層與年齡相關篩檢。"],refs:[29079590,11298544,27210465]},
{q:"治療原則？什麼情況是急症？",a:[
"第一線高劑量類固醇（prednisolone 1 mg/kg），早期加減少類固醇用量的免疫抑制劑（methotrexate、azathioprine；有肺病用 mycophenolate）；難治或吞嚥困難用靜脈注射免疫球蛋白（IVIG）；由免疫風濕科主導。",
"急症警訊：CK 正常但鐵蛋白很高、手掌側疼痛性丘疹、皮膚潰瘍、喘快速惡化 → anti-MDA5 陽性的快速進展性間質性肺病，死亡率高，立即住院、專科共同照護、早期強力免疫抑制。",
"復健、防曬、吸入性肺炎預防、骨質保護；治療反應看肌力，不只看 CK。"],refs:[15880816,36198179]}
]},

{id:"c8",title:"26 歲男性，晨間下背痛與曾發作的紅眼",desc:"下背痛：發炎性 vs 機械性與警訊 → HLA-B27 與影像判讀 → 僵直性脊椎炎的治療原則與併發症",
vig:"26 歲男性，1 年多來下背與臀部痛，清晨最嚴重、活動後改善，晨僵約 45 分鐘，半夜痛醒需起身活動；曾有一次急性紅眼畏光，眼科診斷前葡萄膜炎（虹彩炎）；無發燒或體重減輕。CRP 1.8 mg/dL。",
steps:[
{q:"慢性下背痛的鑑別？哪些是警訊？",a:[
"先分發炎性 vs 機械性：發炎性背痛的特徵是發病 <40 歲、慢慢開始、運動改善、休息不改善、夜間痛，晨僵 >30 分；本例符合。",
"發炎性：僵直性脊椎炎、乾癬性、發炎性腸道疾病相關、反應性關節炎；機械性：椎間盤、小面關節、肌筋膜、脊椎滑脫。",
"警訊：感染（脊椎骨髓炎、結核性脊椎炎、硬膜外膿瘍，線索是發燒、靜脈藥癮、免疫低下）、惡性腫瘤（>50 歲、體重減輕、夜間痛不緩解、癌症史）、骨折（骨鬆、類固醇、外傷）、馬尾症候群（鞍部麻木、大小便失禁）。"],refs:[19297344]},
{q:"檢查與判讀？HLA-B27 陽性代表什麼？",a:[
"骨盆 X 光看薦腸關節炎；早期 X 光常正常 → 薦腸關節磁振造影（骨髓水腫）。",
"HLA-B27：台灣一般族群約 5~6% 陽性、僵直性脊椎炎病人 >90%；陽性只是輔助證據、陰性不排除，不能單獨診斷；CRP 半數正常。",
"找其他脊椎關節炎特徵：葡萄膜炎（虹彩炎）、乾癬、腸道症狀、指趾炎、附著點炎（阿基里斯腱、足底筋膜）、家族史、NSAID 反應好。"],refs:[19297344]},
{q:"診斷確立後的治療原則與要注意的併發症？",a:[
"衛教、規律運動與物理治療、戒菸；NSAID 第一線且規則服用，常有明顯反應；sulfasalazine 只對周邊關節炎有用；不建議全身性類固醇。",
"NSAID 無效轉免疫風濕科考慮生物製劑（TNF 抑制劑等）；急性紅眼當天看眼科。",
"併發症：僵直的脊椎在輕微外傷也可能骨折，外傷後新發頸背痛要做電腦斷層；骨質疏鬆；主動脈瓣閉鎖不全與傳導阻滯；長期 NSAID 的腎與腸胃風險。"],refs:[36270658]}
]},

{id:"c9",title:"32 歲女性，深部靜脈栓塞與反覆流產",desc:"年輕人血栓與反覆流產的鑑別 → 抗磷脂抗體判讀與抽血陷阱 → 抗凝血選擇與災難性 APS",
vig:"32 歲女性，因左小腿腫痛診斷深部靜脈栓塞。過去兩次 10 週前流產與一次 24 週死胎；未服避孕藥，無手術或長途旅行，不吸菸。血小板 105,000、ANA 1:160。",
steps:[
{q:"年輕人靜脈血栓與反覆流產的鑑別？",a:[
"血栓危險因子：後天（不動、手術、含雌激素避孕藥、懷孕產褥期、肥胖、惡性腫瘤、腎病症候群、發炎性腸道疾病）與遺傳性血栓傾向（東亞以 protein S、protein C、antithrombin 缺乏為主）。",
"自體免疫：抗磷脂質症候群（原發或次發於狼瘡）、貝西氏症（血管型）。",
"反覆流產：抗磷脂質症候群、子宮結構異常、染色體異常、內分泌（甲狀腺、糖尿病）。",
"「血栓＋反覆流產（尤其晚期）＋血小板低下＋ANA 陽性」→ 抗磷脂質症候群最可能，並要評估是否有狼瘡。"],refs:[16420554]},
{q:"檢查與判讀？抽血時機有什麼陷阱？",a:[
"抗磷脂抗體三項：狼瘡抗凝血因子（LA）、抗心磷脂抗體（aCL）、抗 β2 醣蛋白 I 抗體；需 12 週後複驗（感染可短暫陽性）；三項都陽性風險最高。",
"陷阱：LA 是功能性檢驗，抗凝血劑（尤其新型口服抗凝血劑）會干擾，要在抗凝血治療前抽。",
"併查 ANA、anti-dsDNA、C3/C4、CBC、尿液（是否為狼瘡）。"],refs:[16420554,37635643]},
{q:"三項都陽性。抗凝血怎麼選？懷孕怎麼辦？什麼是災難性抗磷脂質症候群？",a:[
"靜脈血栓：warfarin（INR 2~3）長期使用；三重陽性或動脈血栓不用新型口服抗凝血劑（試驗顯示血栓事件較多）。",
"懷孕：warfarin 有致畸胎性，改低分子量肝素＋低劑量阿斯匹靈，產後再換回；避免含雌激素避孕藥。",
"災難性抗磷脂質症候群：一週內 ≥3 個器官小血管血栓，常有誘因（感染、手術、停抗凝血劑），死亡率高；需抗凝血＋高劑量類固醇＋血漿置換或 IVIG，送加護病房與專科共同照護。"],refs:[31092409,30002145,12892393]}
]},

{id:"c10",title:"35 歲男性，每晚高燒、咽痛與鮭魚色皮疹",desc:"不明熱的鑑別 → 排除性診斷的檢查順序 → 成人史迪爾氏病的治療與巨噬細胞活化症候群",
vig:"35 歲男性，3 週每晚 39.5°C 尖峰型發燒、白天退燒，咽痛、雙腕與膝關節痛，發燒時軀幹出現淡粉色斑疹。白血球 18,000（嗜中性球 88%）、鐵蛋白（ferritin）6,500 ng/mL、AST/ALT 上升，RF/ANA 陰性，血液培養 ×3 陰性，電腦斷層見輕度肝脾與淋巴結腫大。",
steps:[
{q:"鑑別診斷？",a:[
"框架：年輕成人不明熱＋皮疹＋咽痛＋關節痛＋白血球高＋鐵蛋白極高。",
"感染：EB 病毒、巨細胞病毒、急性 HIV、感染性心內膜炎、結核、深部膿瘍、恙蟲病（台灣，找焦痂）、登革熱。",
"惡性：淋巴瘤、白血病。",
"自體免疫／自體發炎：成人史迪爾氏病、全身性紅斑狼瘡、血管炎、菊池氏病（Kikuchi，年輕亞洲女性、頸部淋巴結、發燒，自限）、藥物過敏（DRESS）。",
"支持成人史迪爾氏病的線索：每天一次尖峰型發燒、發燒時出現又消退的鮭魚色皮疹、咽痛、嗜中性球增多、鐵蛋白很高、RF/ANA 陰性；但它是排除性診斷。"],refs:[1578458]},
{q:"檢查怎麼排？何時做淋巴結切片或骨髓檢查？",a:[
"感染：血液培養 ×3、EB 病毒／巨細胞病毒／HIV／B、C 型肝炎、恙蟲病血清、結核（IGRA）、心臟超音波、電腦斷層找膿瘍。",
"自體免疫：ANA、RF、補體、鐵蛋白、肝功能、凝血功能。",
"腫瘤：頸胸腹骨盆電腦斷層、LDH；淋巴結持續腫大或血球低下 → 淋巴結切片與骨髓檢查。",
"Yamaguchi 標準：發燒、關節痛、典型皮疹、白血球增多為主要項目，需先排除感染、腫瘤與其他風濕病。"],refs:[1578458,39317417]},
{q:"排除後確診。治療原則？治療第 2 週再發燒、血小板降到 70,000、ESR 反而降到 15、鐵蛋白升到 28,000，發生什麼事？",a:[
"治療：NSAID 少數有效；多數用類固醇（0.5~1 mg/kg）；復發或依賴類固醇由專科加 methotrexate 或 IL-1／IL-6 抑制劑。",
"巨噬細胞活化症候群（次發性噬血症候群）：發燒持續、血球（尤其血小板）下降、鐵蛋白飆升、ESR 反常下降（纖維蛋白原被消耗）、三酸甘油酯與肝指數上升。",
"這是急症：找誘因（感染），高劑量類固醇脈衝治療＋專科用藥（anakinra、環孢素），加護病房照護，不可延誤。"],refs:[39317417,26865703]}
]},

{id:"c11",title:"38 歲女性，清晨四肢無力與嚴重低血鉀",desc:"低血鉀性麻痺的鑑別（台灣最常見的是什麼？）→ 腎小管酸血症 → 乾燥症的診斷與長期注意事項",
vig:"38 歲女性，清晨醒來四肢無力無法起床，意識清楚。K 1.9 mmol/L、Na 138、Cl 115、HCO3 14、BUN/Cr 正常；動脈血 pH 7.28；尿 pH 6.5。過去 2 年常口乾眼乾、蛀牙增加，曾兩側腮腺腫。",
steps:[
{q:"低血鉀性麻痺的鑑別？怎麼分類？",a:[
"先分「鉀往細胞內轉移」還是「真的流失」（腎外或腎性）：看尿鉀與酸鹼狀態。",
"轉移型：甲狀腺毒性週期性麻痺（<b>台灣最常見</b>，年輕男性、大餐或運動後，驗 TSH）、家族性低血鉀週期性麻痺、胰島素、β 促效劑。",
"腎外流失：腹瀉、瀉劑、嘔吐（多伴代謝性鹼中毒）。",
"腎性流失：利尿劑、原發性高醛固酮血症（高血壓＋低血鉀＋鹼中毒）、Gitelman/Bartter 症候群（鹼中毒）、腎小管酸血症（高氯性代謝性酸中毒）、低血鎂。",
"本例：高氯性代謝性酸中毒（陰離子間隙正常）＋低血鉀＋尿 pH >5.5 → 遠端腎小管酸血症；成人首先想乾燥症（修格蘭氏症候群）。"],refs:[27785888]},
{q:"怎麼確立乾燥症？腮腺腫的鑑別？",a:[
"客觀乾燥證據：淚液分泌試驗（Schirmer ≤5 mm/5 分）、唾液流速；anti-SSA/Ro 抗體；唇腺切片（淋巴球浸潤）；需排除 C 型肝炎、HIV、頭頸部放射治療、IgG4 相關疾病、類肉瘤病。",
"併查：CBC、RF（常陽性）、ANA、免疫球蛋白（IgG 常升高）、C3/C4、尿液（腎小管間質腎炎）、胸部 X 光。",
"腮腺腫的鑑別：乾燥症、IgG4 相關疾病、類肉瘤病、病毒或細菌性腮腺炎、淋巴瘤、HIV、酒精或糖尿病造成的腮腺肥大。"],refs:[27785888]},
{q:"anti-SSA 陽性、Schirmer 3 mm、唇腺切片陽性。診斷、治療原則與長期要注意什麼？",a:[
"原發性乾燥症合併遠端腎小管酸血症。",
"急性期補鉀（口服為主，嚴重或心律不整者靜脈補充並監測心電圖）；長期以碳酸氫鈉或檸檬酸鉀矯正酸中毒；乾燥症狀用人工淚液、唾液促進劑、口腔衛生；全身病變由專科用 hydroxychloroquine、類固醇或免疫抑制劑。",
"長期注意淋巴瘤（風險約 5~10%）：持續腮腺腫大、紫斑、低 C4、淋巴結腫大、血球低下 → 切片；育齡女性 anti-Ro 陽性懷孕時要監測胎兒心臟傳導阻滯。"],refs:[31672775,32090480]}
]}
];

/* ===================== 邏輯 ===================== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const pmid = id => `<a class="pmid" href="https://pubmed.ncbi.nlm.nih.gov/${id}/" target="_blank" rel="noopener" title="${esc(REFS[id] || "")}">PMID ${id}</a>`;
const refLine = ids => ids && ids.length ? `<div class="refs">文獻：${ids.map(pmid).join("")}</div>` : "";

const state = { done: new Set() };
const cs = { cur: null, step: 0, timerId: null, left: 60 };

function renderProg() {
  const n = state.done.size;
  $("#prog").textContent = n === CASES.length ? `${CASES.length} 個病例全部完成。可按「重設進度」再練一輪。` : `已完成 ${n} / ${CASES.length} 個病例`;
}
function renderCaseList() {
  $("#case-list").innerHTML = CASES.map((c, i) => `<button type="button" class="case-item${state.done.has(c.id) ? " done" : ""}${cs.cur && cs.cur.id === c.id ? " active" : ""}" data-id="${c.id}"><span class="n">${i + 1}</span><span><span class="t">${c.title}</span><span class="d">${c.desc}</span></span></button>`).join("");
  $$("#case-list .case-item").forEach(b => b.addEventListener("click", () => openCase(b.dataset.id)));
  renderProg();
}
function stopTimer() { if (cs.timerId) { clearInterval(cs.timerId); cs.timerId = null; } }
function startTimer() {
  stopTimer();
  const t = $("#timer");
  if (!t) return;
  if (!$("#case-timer-on").checked) { t.textContent = ""; t.classList.remove("low"); return; }
  cs.left = 60;
  t.textContent = "60 秒"; t.classList.remove("low");
  cs.timerId = setInterval(() => {
    cs.left--;
    t.textContent = cs.left > 0 ? `${cs.left} 秒` : "時間到，請作答";
    if (cs.left <= 10) t.classList.add("low");
    if (cs.left <= 0) stopTimer();
  }, 1000);
}
function openCase(id) {
  cs.cur = CASES.find(c => c.id === id);
  cs.step = 0;
  renderCaseList();
  renderCase();
}
function renderCase() {
  const c = cs.cur, s = c.steps[cs.step], last = cs.step === c.steps.length - 1;
  const idx = CASES.indexOf(c);
  $("#case-view").innerHTML = `<div class="case">
<p class="small muted">病例 ${idx + 1} / ${CASES.length}</p>
<h3>${c.title}</h3>
<p class="vig">${c.vig}</p>
<div class="step">
<p class="q">${s.q}<span class="timer" id="timer"></span></p>
<p class="small muted">先大聲說出你的回答，再看參考答案。</p>
<button type="button" class="btn primary" id="reveal">顯示參考答案</button>
<div class="ans" id="ans" hidden><ul>${s.a.map(x => `<li>${x}</li>`).join("")}</ul>${refLine(s.refs)}</div>
</div>
<div class="case-nav">
<span class="small">第 ${cs.step + 1} / ${c.steps.length} 題</span>
<span>
<button type="button" class="btn" id="case-back">關閉病例</button>
<button type="button" class="btn primary" id="case-next" disabled>${last ? "完成病例" : "下一題"}</button>
</span></div></div>`;
  $("#reveal").addEventListener("click", () => { $("#ans").hidden = false; $("#reveal").disabled = true; $("#case-next").disabled = false; stopTimer(); $("#timer").textContent = ""; });
  $("#case-next").addEventListener("click", () => {
    if (last) { state.done.add(c.id); renderDone(); }
    else { cs.step++; renderCase(); }
  });
  $("#case-back").addEventListener("click", closeCase);
  startTimer();
  $("#case-view").scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderDone() {
  stopTimer();
  const c = cs.cur, idx = CASES.indexOf(c);
  const nextC = CASES.find((x, i) => i > idx && !state.done.has(x.id)) || CASES.find(x => !state.done.has(x.id));
  $("#case-view").innerHTML = `<div class="case">
<h3>完成：${c.title}</h3>
<p class="small">回想一下：這個病例的三個關鍵句你能不看答案說出來嗎？說不出來就再做一次。</p>
<p class="small muted">已完成 ${state.done.size} / ${CASES.length} 個病例</p>
<div class="case-nav">
<span>
<button type="button" class="btn" id="case-redo">再做一次</button>
<button type="button" class="btn" id="case-back">關閉病例</button>
</span>
<span>${nextC ? `<button type="button" class="btn primary" id="case-go-next">下一個病例</button>` : ""}</span>
</div></div>`;
  $("#case-redo").addEventListener("click", () => openCase(c.id));
  $("#case-back").addEventListener("click", closeCase);
  const nb = $("#case-go-next"); if (nb) nb.addEventListener("click", () => openCase(nextC.id));
  renderProg();
  $("#case-view").scrollIntoView({ behavior: "smooth", block: "start" });
}
function closeCase() { stopTimer(); cs.cur = null; $("#case-view").innerHTML = ""; renderCaseList(); }
$("#case-timer-on").addEventListener("change", () => { if (cs.cur && $("#timer")) startTimer(); });
$("#case-random").addEventListener("click", () => {
  const pool = CASES.filter(c => !state.done.has(c.id));
  const pick = (pool.length ? pool : CASES)[Math.floor(Math.random() * (pool.length ? pool : CASES).length)];
  openCase(pick.id);
});
$("#case-reset").addEventListener("click", () => { state.done.clear(); renderCaseList(); });

/* ---- 文獻 ---- */
(function renderRefs() {
  const ids = []; CASES.forEach(c => c.steps.forEach(s => (s.refs || []).forEach(r => { if (!ids.includes(r)) ids.push(r); })));
  $("#ref-list").innerHTML = `<ol>${ids.map(r => `<li>${esc(REFS[r] || "")} ${pmid(r)}</li>`).join("")}</ol>`;
  $("#ref-count").textContent = `${ids.length} 篇`;
})();
renderCaseList();

</script>
</body>
</html>
